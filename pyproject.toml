[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroglp"
version = "0.1.0"
description = "Zero-Cost Pharmacovigilance & Latent Phenotyping Platform for GLP-1 Psychiatric Adverse Events"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Abdullah", email = "abdullah.khan.pharmd@gmail.com" }
]
keywords = [
    "pharmacovigilance",
    "openfda",
    "glp-1",
    "semaglutide",
    "tirzepatide",
    "umap",
    "hdbscan",
    "phenotyping",
    "bioinformatics"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "umap-learn>=0.5.5",
    "hdbscan>=0.8.33",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.2.0",
    "python-docx>=1.1.0",
]
docs = [
    "python-docx>=1.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
neuroglp = ["data/*.json.gz", "data/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["neuroglp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --durations=10"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
